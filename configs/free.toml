# Free live profile: real ETF prices, macro/FOMC data and keyless news sources.
# Requires only FRED_API_KEY; Alpha Vantage news is optional.

[universe]
symbols = ["SPY", "QQQ", "IWM", "XLK", "XLF", "XLE", "TLT", "GLD", "SOXX"]
targets = ["SPY", "QQQ", "IWM", "SOXX"]

[data]
start = "2014-01-01"
end = ""
prices_path = "data/market/prices.parquet"
features_path = "data/processed/features.parquet"
warehouse_path = "data/warehouse.duckdb"
raw_dir = "data/raw"

[model]
horizon_days = 5
test_fraction = 0.20
probability_threshold = 0.50
random_seed = 42
tuning_trials = 24
tuning_folds = 4
intraday_tuning_trials = 12
intraday_tuning_folds = 3

[output]
artifacts_dir = "artifacts"

[sources.market]
provider = "nasdaq"

[sources.macro]
enabled = true
provider = "fred"
series = [
  { id = "DGS10" },
  { id = "DGS2" },
  { id = "T10Y2Y" },
  { id = "VIXCLS" },
  { id = "BAMLH0A0HYM2" },
  { id = "DFF" },
  { id = "CPIAUCSL", vintage = true },
  { id = "UNRATE", vintage = true },
  { id = "ICSA", vintage = true },
]

[sources.fundamental]
enabled = false
provider = "synthetic"

[sources.news]
enabled = true
provider = "hybrid"
incremental = true
topics = ["financial_markets", "economy_macro", "technology", "geopolitical"]
window_days = 30
max_requests = 20
gdelt_timespan = "3months"
gdelt_max_records = 250
google_news_days = 30

[sources.geopolitical]
enabled = true
provider = "gpr"

[sources.central_bank]
enabled = true
provider = "fred"
meetings_csv = "data/reference/fomc_meetings.csv"
